name: TimesFM tahminlerini guncelle

on:
  workflow_dispatch: {}
  schedule:
    # Her 6 saatte bir (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: generate-forecasts
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Tahminleri uret
        run: python generate_forecasts.py

      - name: forecasts.json'i commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/forecasts.json
          git diff --cached --quiet || git commit -m "Tahminleri guncelle [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
