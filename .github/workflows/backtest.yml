name: Walk-forward backtest calistir

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Kac gunluk gecmis (varsayilan 75)"
        required: false
        default: "75"
      step_hours:
        description: "Kesim noktasi araligi, saat (canli sistemle ayni: 6)"
        required: false
        default: "6"
      leverage:
        description: "Kaldirac"
        required: false
        default: "1"
      fee_pct:
        description: "Islem basi komisyon yuzdesi (giris/cikis ayri ayri)"
        required: false
        default: "0.05"
      max_cutpoints:
        description: "Kesim noktasi sayisini sinirla (0 = sinirsiz, test icin kucuk tutun)"
        required: false
        default: "0"
      coins:
        description: "Virgulle ayrilmis coin alt kumesi (bos = COINS'in tumu)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Backtest calistir
        env:
          BACKTEST_DAYS: ${{ inputs.days }}
          BACKTEST_STEP_HOURS: ${{ inputs.step_hours }}
          BACKTEST_LEVERAGE: ${{ inputs.leverage }}
          BACKTEST_FEE_PCT: ${{ inputs.fee_pct }}
          BACKTEST_MAX_CUTPOINTS: ${{ inputs.max_cutpoints }}
          BACKTEST_COINS: ${{ inputs.coins }}
        run: python scripts/backtest.py

      - name: docs/backtest.json'i commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/backtest.json
          git diff --cached --quiet || git commit -m "Backtest sonuclarini guncelle [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
